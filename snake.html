<!DOCTYPE html>
<html lang="en">
  <head>
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Snake</h1>
  <p><a href="index.html">Back to home</a></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
 
<script>
  var canvas = document.getElementById("gameCanvas");
  var ctx = canvas.getContext("2d");
  var CELL = 20;
  var COLS = canvas.width / CELL;
  var ROWS = canvas.height / CELL;

  var snake = { x: 5, y: 5 };

  function drawBoard() {
    ctx.fillStyle = "#1b1b1b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#3ddc84";
    ctx.fillRect(snake.x * CELL, snake.y * CELL, CELL, CELL);
  }

  function step() {

    snake.x = snake.x + 1;


    if (snake.x >= COLS) {
      snake.x = 0;
    }

    drawBoard();
  }

  setInterval(step, 100);

  drawBoard();

  function step() {
  snake.x = snake.x + dx;
  snake.y = snake.y + dy;
 
  if (snake.x > 380) { snake.x = 0; }
  if (snake.x < 0) { snake.x = 380; }
  if (snake.y > 380) { snake.y = 0; }
  if (snake.y < 0) { snake.y = 380; }
 
  drawBoard();
}

  if (event.key === "ArrowUp") {
    dx = 0;
    dy = -20;
  }
  if (event.key === "ArrowDown") {
    dx = 0;
    dy = 20;
  }
</script>
</body>
</html>
