  <canvas id="gameCanvas" width="400" height="400"></canvas>
 
  <script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var CELL = 20;
 
    var snake = { x: 5, y: 5 };
 
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 400, 400);
 
    ctx.fillStyle = "lime";
    ctx.fillRect(snake.x * CELL, snake.y * CELL, CELL, CELL);
  </script>
